name: publish-scheduled-reels

# Checks every 15 minutes (GitHub may delay a run by several minutes) and posts any
# Instagram Reel in schedule/queue.json whose publish_at time has passed.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only test the INSTAGRAM_ACCESS_TOKEN secret (posts nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-scheduled-reels
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check token only (posts nothing)
        if: ${{ inputs.check_only }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/publish_instagram.py --check-token
      - name: Publish due reels
        if: ${{ !inputs.check_only }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/publish_instagram.py
      - name: Save queue state
        if: always()
        run: |
          git config user.name "AI DECODE hub"
          git config user.email "noreply@users.noreply.github.com"
          git add schedule/queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Update schedule state"
            git pull --rebase origin main
            git push
          fi
